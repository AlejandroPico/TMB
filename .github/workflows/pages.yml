name: Publicar aplicación de transporte
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Periodo de la cartografía
        id: geometry-date
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            tools/cache/rail-links.json
            tools/cache/tussam-paths.json
            tools/cache/metro-osm.json
          key: geometry-v1-${{ steps.geometry-date.outputs.month }}
      - name: Actualizar el GTFS sin perder la copia disponible
        continue-on-error: true
        env:
          TMB_APP_ID: ${{ secrets.TMB_APP_ID }}
          TMB_APP_KEY: ${{ secrets.TMB_APP_KEY }}
        run: python tools/import_networks.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/audit_geometry.py
      - run: python tools/audit_night_services.py
      - run: pnpm build
        env:
          BASE_PATH: /TMB/
          VITE_APP_NAME: ${{ vars.APP_NAME }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
